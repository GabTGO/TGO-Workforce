# Local development only. On Railway, backend/worker/frontend are three
# separate services — backend on Nixpacks (backend/railway.json), worker as
# its own Dockerfile-builder service pointed at backend/Dockerfile.worker
# (same pattern as the standalone attendance app's TGO AV Worker service) —
# plus a managed Postgres add-on shared by backend and worker. This compose
# file is not what gets deployed, it's for running the backend + worker +
# database on your laptop. Run the frontend separately with `npm run dev`
# (in src's parent directory) — it has no Dockerfile here since Railway/
# Nixpacks don't need one for it either.
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tgo_workforce
    ports:
      - "5432:5432"
    volumes:
      - tgo_workforce_db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tgo_workforce
    ports:
      - "8000:8000"
    depends_on:
      - db

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tgo_workforce
    depends_on:
      - db

volumes:
  tgo_workforce_db_data:
