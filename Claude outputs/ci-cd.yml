name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-ci:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend-ci:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tgo_workforce
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tgo_workforce
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  # Both deploy jobs only run for a push to main (never for a PR), and only
  # after both CI jobs pass — that's the "gate" in front of Railway. Railway's
  # own GitHub auto-deploy should stay OFF for these two services so this
  # workflow is the only thing that ships a deploy; otherwise a broken commit
  # could still deploy straight from Railway's side before CI even finishes.
  #
  # Repo setup required once, in GitHub → Settings → Secrets and variables:
  #   Secrets:   RAILWAY_TOKEN               (Railway → Project Settings → Tokens)
  #   Variables: RAILWAY_FRONTEND_SERVICE     (exact service name in Railway)
  #              RAILWAY_BACKEND_SERVICE      (exact service name in Railway)

  deploy-frontend:
    name: Deploy frontend to Railway
    needs: [frontend-ci, backend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @railway/cli
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service "${{ vars.RAILWAY_FRONTEND_SERVICE }}" --detach

  deploy-backend:
    name: Deploy backend to Railway
    needs: [frontend-ci, backend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @railway/cli
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service "${{ vars.RAILWAY_BACKEND_SERVICE }}" --detach
